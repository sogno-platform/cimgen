name: Python Build and Test on Linux and Windows

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Python Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --require-hashes "--only-binary=:all:" -r requirements.txt

      - name: Install package
        run: python -m pip install --no-deps .

      - name: Install pytest
        run: python -m pip install "--only-binary=:all:" pytest==9.2.0

      - name: Test
        run: python -m pytest
