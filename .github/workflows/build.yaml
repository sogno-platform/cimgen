name: Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Generate code

    runs-on: ubuntu-latest

    strategy:
      matrix:
        language:
        - java
        - javascript
        - python
        - modernpython
        - cpp

        version:
        - cgmes_v2_4_15
        - cgmes_v3_0_0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Generate code
        run: |
          python -m venv venv
          . venv/bin/activate

          pip install .

          # Run cimgen with the valid version
          cimgen \
            --langdir=${{matrix.language}} \
            --cgmes_version=${{matrix.version}} \
            --outdir=output/${{matrix.language}}/${{matrix.version}}

      - name: Create artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.version}}-${{matrix.language}}
          path: output/${{matrix.language}}
