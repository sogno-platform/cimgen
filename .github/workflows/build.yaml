name: Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Generate code

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.13'

        language:
        - cpp
        - java
        - javadb
        - js
        - python
        - python-simple

        version:
        - cgmes_v2_4_15
        - cgmes_v3_0_0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Generate code
        run: |
          python -m venv venv
          . venv/bin/activate

          pip install --require-hashes --only-binary=:all: -r requirements.txt
          pip install --no-deps .

          # Run cimgen with the valid version
          cimgen \
            --lang=${{matrix.language}} \
            --version=${{matrix.version}} \
            --output=output/${{matrix.language}}/${{matrix.version}}

      - name: Create artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.version}}-${{matrix.language}}
          path: output/${{matrix.language}}
