[project]
name = "cimgen"
version = "0.1.0"
description = "Code generation from CIM data model for several programming languages"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
keywords = ["cim", "cgmes", "code-generation"]

dependencies = [
    "xmltodict >= 0.13.0, < 1",
    "chevron >= 0.14.0, < 1",
    "pydantic < 2",
    "beautifulsoup4 >= 4.12.2, < 5",
    "setuptools"
]

requires-python = ">=3.11"

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",

  "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
dev = [
  "pip-tools >= 7.6.1",
  "pre_commit",
  "reuse",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/sogno-platform/cimgen"
Repository = "https://github.com/sogno-platform/cimgen"
Issues = "https://github.com/sogno-platform/cimgen/issues"

[project.scripts]
cimgen = "cimgen.build:build"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Include all .sql and .json files found in any package
"*" = ["*.mustache", "*.java", "*.hpp", "*.cpp"]

[tool.setuptools.packages.find]
include = ["cimgen*"]

[tool.ruff]
line-length = 120
extend-exclude = ["cimgen/languages/modernpython/README.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
